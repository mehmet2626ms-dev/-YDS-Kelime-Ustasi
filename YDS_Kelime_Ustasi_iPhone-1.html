function definitionFor(q){

}

    arr=[{id:q.id,value:definitionFor(q)},{id:pool[0].id,value:definitionFor(pool[0])},{id:pool[1].id,value:definitionFor(pool[1])},{id:pool[2].id,value:definitionFor(pool[2])}];

function showLists(){screen='lists';render()}function listsHTML(){let learned=WORDS.filter(x=>state.learned.includes(x.id)), learning=WORDS.filter(x=>state.learning.includes(x.id));return `<div class="wrap"><div class="top"><div><div class="brand">📚 Kelime Listeleri</div><div class="sub">Her kelimenin eş anlamlılarını ve durumunu gör</div></div><button class="btn secondary" onclick="home()">Ana Menü</button></div><div class="grid"><div class="card"><h3>Öğrendiklerim (${learned.length})</h3><button class="btn good" onclick="startFrom('learned')">Test oluştur</button><div class="list">${learned.map(x=>itemHTML(x)).join('')||'<p class="sub">Henüz yok.</p>'}</div></div><div class="card"><h3>Öğreneceklerim (${learning.length})</h3><button class="btn" onclick="startFrom('learning')">Test oluştur</button><div class="list">${learning.map(x=>itemHTML(x)).join('')||'<p class="sub">Henüz yok.</p>'}</div></div></div></div>`}function itemHTML(x){return `<div class="item"><div><b>${esc(x.word)}</b><div class="small">${esc(x.meaning)}</div><div class="small">${esc(x.synonyms.join(', '))}</div></div><span class="badge">Gün ${x.day}</span></div>`}
function showStats(){screen='stats';render()}function statsHTML(){let total=WORDS.length,attempted=Object.keys(state.stats).length,correct=Object.values(state.stats).reduce((s,x)=>s+x.correct,0),wrong=Object.values(state.stats).reduce((s,x)=>s+x.wrong,0);let weak=WORDS.filter(x=>((state.stats[x.id]&&state.stats[x.id].wrong)||0)>0).sort((a,b)=>(state.stats[b.id]?.wrong||0)-(state.stats[a.id]?.wrong||0)).slice(0,20);return `<div class="wrap"><div class="top"><div><div class="brand">📊 İstatistikler</div><div class="sub">İlerleyişin cihazında saklanır.</div></div><button class="btn secondary" onclick="home()">Ana Menü</button></div><div class="grid"><div class="card"><div class="small">Toplam</div><div class="stat">${total}</div></div><div class="card"><div class="small">Öğrendim</div><div class="stat">${state.learned.length}</div></div><div class="card"><div class="small">Öğreneceğim</div><div class="stat">${state.learning.length}</div></div><div class="card"><div class="small">Cevap başarı</div><div class="stat">${correct+wrong?Math.round(correct/(correct+wrong)*100):0}%</div></div></div><div class="card panel"><h3>En çok zorlandıkların</h3><div class="list">${weak.map(x=>`<div class="item"><div><b>${esc(x.word)}</b><div class="small">${esc(x.meaning)}</div></div><span class="badge">${state.stats[x.id].wrong} yanlış</span></div>`).join('')||'<p class="sub">Henüz yeterli veri yok.</p>'}</div></div></div>`}
try{render()}catch(e){document.getElementById('app').innerHTML='<div style="font-family:Arial;padding:30px;max-width:700px;margin:auto"><h2>YDS Kelime Ustası</h2><p>Uygulama başlatılırken bir hata oluştu.</p><pre style="white-space:pre-wrap;background:#eee;padding:12px;border-radius:8px">'+String(e&&e.stack||e)+'</pre><p>Bu ekran görünüyorsa JavaScript çalışıyor; hata ayrıntısını bana gönderebilirsiniz.</p></div>'}
</script></body></html>
