const initial={learned:[],learning:[],reinforced:[],correctTests:{},stats:{},queue:[],settings:{}};

function cleanObj(v){return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}

   if(arr.length>=4){
     state.learned=state.learned.filter(x=>x!==id);

}
function home(){screen='home';test=null;render()}function render(){const a=document.getElementById('app');a.innerHTML=screen==='home'?homeHTML():screen==='test'?testHTML():screen==='lists'?listsHTML():screen==='stats'?statsHTML():''}
function homeHTML(){return `<div class="wrap"><div class="top"><div><div class="brand">🧠 YDS / YÖKDİL Kelime Ustası</div><div class="sub">Tek havuz • ${WORDS.length} kelime • kişisel tekrar sistemi</div></div><div class="row"><button class="btn secondary" onclick="showLists()">📚 Kelimeler</button><button class="btn secondary" onclick="showStats()">📊 İstatistik</button></div></div><div class="grid"><div class="card"><h3>🏆 Pekiştirdiklerim</h3><div class="stat">${state.reinforced.length}</div><div class="sub">4 farklı testte doğru</div><button class="btn good" style="margin-top:12px" onclick="startFrom('reinforced')">Tekrar Testi</button></div><div class="card"><h3>Öğrendiklerim</h3><div class="stat">${state.learned.length}</div><div class="sub">Öğrendiğin kelimeler</div><button class="btn good" style="margin-top:12px" onclick="startFrom('learned')">Tekrar Testi</button></div><div class="card"><h3>Öğreneceklerim</h3><div class="stat">${state.learning.length}</div><div class="sub">Yanlış / bilmiyorum havuzu</div><button class="btn" style="margin-top:12px" onclick="startFrom('learning')">Tekrar Testi</button></div><div class="card"><h3>Toplam</h3><div class="stat">${WORDS.length}</div><div class="sub">Yeni kelimeler</div><button class="btn secondary" style="margin-top:12px" onclick="openSetup('all')">Yeni kelimelerden test</button></div></div><div class="card panel"><h3>Yeni Test Oluştur</h3><div class="grid"><div><div class="small">Kelime kaynağı</div><select id="day" class="select"><option value="all">Yeni kelimeler (${WORDS.filter(x=>status(x.id)==='new').length})</option><option value="learning">Öğreneceklerim (${state.learning.length})</option><option value="learned">Öğrendiklerim (${state.learned.length})</option><option value="reinforced">Pekiştirdiklerim (${state.reinforced.length})</option><option value="weak">En zayıf kelimeler</option></select></div><div><div class="small">Soru sayısı</div><input id="count" class="select" type="number" min="1" value="20" placeholder="Örn. 200"></div><div><div class="small">Soru yönü</div><select id="mode" class="select"><option value="en-tr">İngilizce → Türkçe</option><option value="tr-en">Türkçe → İngilizce</option><option value="en-en">İngilizce → İngilizce</option><option value="context">Cümlede boşluk</option></select></div></div><div class="row" style="margin-top:14px"><button class="btn" onclick="beginSetup()">Teste Başla</button><span class="small">100, 200, 300… istediğin kadar seçebilirsin. Aynı kelime testte tekrarlanmaz.</span></div></div><div class="card panel"><h3>🎯 Bugünün önerisi</h3><p class="sub">Önce Öğreneceklerim'deki kelimeleri tekrar et. Sonra yeni günlerden 20–30 kelime çalış. Yanlış yaptıkların otomatik olarak tekrar havuzuna alınır.</p></div></div>`}
function openSetup(d){document.getElementById('day').value=d;try{window.scrollTo(0,document.body.scrollHeight)}catch(e){window.scrollTo(0,document.body.scrollHeight)}}
function beginSetup(){let d=document.getElementById('day').value;let n=Math.max(1,parseInt(document.getElementById('count').value||20));let mode=document.getElementById('mode').value;startTest(d,n,mode)}
function startFrom(type){let n=type==='learning'?state.learning.length:type==='reinforced'?state.reinforced.length:Math.min(20,state.learned.length);startTest(type,Math.max(1,n), 'en-tr')}
function startTest(source,n,mode){let pool=source==='reinforced'?WORDS.filter(x=>state.reinforced.includes(x.id)):source==='learned'?WORDS.filter(x=>state.learned.includes(x.id)):source==='learning'?WORDS.filter(x=>state.learning.includes(x.id)):source==='weak'?WORDS.filter(x=>((state.stats[x.id]&&state.stats[x.id].wrong)||0)>0).sort((a,b)=>(state.stats[b.id]?.wrong||0)-(state.stats[a.id]?.wrong||0)):WORDS.filter(x=>status(x.id)==='new');if(!pool.length){alert('Bu listede henüz kelime yok.');return}pool=unique(pool).sort(()=>Math.random()-.5).slice(0,Math.min(n,pool.length));test={pool,index:0,score:0,wrong:0,mode,answered:false,paused:false,sessionId:String(Date.now())+'_'+Math.random().toString(36).slice(2)};screen='test';render()}
function definitionFor(q){
  if(q.definition)return q.definition;
  const syn=(q.synonyms||[]).filter(Boolean).slice(0,3);
  if(!syn.length)return 'an English word with a related meaning';
  const w=q.word.toLowerCase();
  const verbs=new Set(['analyze','approach','indicate','establish','assess','evaluate','determine','identify','investigate','examine','demonstrate','suggest','imply','assume','observe','interpret','reveal','confirm','obtain']);
  return verbs.has(w)?'to '+syn.join(', or '):syn.join(', or ');
}
function choiceObjects(q){
  let pool=WORDS.filter(x=>x.id!==q.id).sort(()=>Math.random()-.5).slice(0,3);
  let arr;
  if(test.mode==='en-tr'){
    arr=[{id:q.id,value:q.meaning},{id:pool[0].id,value:pool[0].meaning},{id:pool[1].id,value:pool[1].meaning},{id:pool[2].id,value:pool[2].meaning}];
  }else if(test.mode==='en-en'){
    arr=[{id:q.id,value:definitionFor(q)},{id:pool[0].id,value:definitionFor(pool[0])},{id:pool[1].id,value:definitionFor(pool[1])},{id:pool[2].id,value:definitionFor(pool[2])}];
  }else{
    arr=[{id:q.id,value:q.word},{id:pool[0].id,value:pool[0].word},{id:pool[1].id,value:pool[1].word},{id:pool[2].id,value:pool[2].word}];
  }
  return arr.sort(()=>Math.random()-.5).map((x,i)=>({...x,letter:String.fromCharCode(65+i)}));
}
function testHTML(){
  if(test.paused)return `<div class="wrap"><div class="card" style="max-width:600px;margin:80px auto;text-align:center"><h2>⏸️ Test Duraklatıldı</h2><p class="sub">${test.index} / ${test.pool.length} soru tamamlandı.</p><div class="row" style="justify-content:center"><button class="btn" onclick="test.paused=false;render()">Devam Et</button><button class="btn secondary" onclick="home()">Ana Menü</button></div></div></div>`;
  if(test.index>=test.pool.length)return resultHTML();
  let q=test.pool[test.index];
  let display=test.mode==='tr-en'?q.meaning:(test.mode==='context'?q.phrase.replace(new RegExp('\\b'+q.word.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'\\b','i'),'_____'):q.word);
  let label=test.mode==='context'?'Cümlede doğru kelimeyi seç':test.mode==='tr-en'?'Türkçe anlam':test.mode==='en-en'?'English → English':'Kelime';
  let choices=choiceObjects(q);
  return `<div class="wrap"><div class="top"><div><div class="brand">📝 Test</div><div class="sub">Soru ${test.index+1} / ${test.pool.length} • Doğru ${test.score} • Yanlış ${test.wrong}</div></div><div class="row"><button class="btn secondary" onclick="pauseTest()">⏸ Ara Ver</button><button class="btn danger" onclick="finishEarly()">✕ Bitir</button></div></div><div class="progress"><div style="width:${test.index/test.pool.length*100}%"></div></div><div class="question"><div class="small">${label}</div><div class="word">${esc(display)}</div><div class="choices">${choices.map(c=>`<button class="choice" ${test.answered?'disabled':''} onclick="answer(${q.id},${c.id})"><b>${c.letter})</b> ${esc(c.value)}${test.mode!=='en-tr'?` <span class="small">— ${esc(((WORDS.find(x=>x.id===c.id)||{}).synonyms||[]).join(', ')||'')}</span>`:''}</button>`).join('')}<button class="choice" ${test.answered?'disabled':''} onclick="answer(${q.id},null)"><b>E)</b> Bilmiyorum</button></div><div id="fb"></div></div></div>`;
}
function answer(id,choiceId){
  if(test.answered)return;
  let q=WORDS.find(x=>x.id===id),dontKnow=choiceId===null,correct=!dontKnow&&choiceId===q.id;
  test.answered=true;mark(id,correct);
  if(correct){test.score++;setTimeout(()=>{test.index++;test.answered=false;render()},350)}
  else{
    test.wrong++;
    let f=document.getElementById('fb');
    let correctText=test.mode==='en-tr'?q.meaning:(test.mode==='en-en'?definitionFor(q):q.word);
    let syn=(q.synonyms||[]).filter(Boolean).join(', ');
    f.innerHTML=`<div class="feedback"><div class="row" style="margin-bottom:12px"><button class="btn" style="width:100%" onclick="nextAfterWrong()">Devam Et →</button></div><h4>${dontKnow?'🤔 Cevap:':'❌ Doğru cevap:'} <b>${esc(correctText)}</b></h4><div><b>${esc(q.word)}</b> — ${esc(q.meaning)}</div>${!dontKnow?`<div class="small" style="margin-top:7px">Eş anlamlılar: ${esc(syn)}</div>`:''}<div class="ex" style="margin-top:10px"><b>Kısa kullanım:</b> ${esc(q.phrase)}</div><div class="tr">🇹🇷 ${esc(q.meaning)}</div></div>`;f.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}
function nextAfterWrong(){test.index++;test.answered=false;render()}function pauseTest(){test.paused=true;render()}function finishEarly(){if(confirm('Testi bitirip ana menüye dönmek istiyor musun?'))home()}
function resultHTML(){let pct=test.pool.length?Math.round(test.score/test.pool.length*100):0;return `<div class="wrap"><div class="card" style="max-width:650px;margin:60px auto;text-align:center"><div style="font-size:54px">${pct>=80?'🏆':pct>=60?'👏':'💪'}</div><h1>Test Tamamlandı</h1><div class="stat">%${pct}</div><p class="sub">${test.score} doğru • ${test.wrong} yanlış • ${test.pool.length} soru</p><div class="row" style="justify-content:center;margin-top:18px"><button class="btn" onclick="home()">Ana Menü</button><button class="btn secondary" onclick="startTest('learning',Math.max(1,state.learning.length),'en-tr')">Öğreneceklerimi Tekrarla</button></div></div></div>`}
function showLists(){screen='lists';render()}function listsHTML(){let reinforced=WORDS.filter(x=>state.reinforced.includes(x.id)),learned=WORDS.filter(x=>state.learned.includes(x.id)),learning=WORDS.filter(x=>state.learning.includes(x.id));return `<div class="wrap"><div class="top"><div><div class="brand">📚 Kelime Listeleri</div><div class="sub">Durumuna göre kelimeleri tekrar et</div></div><button class="btn secondary" onclick="home()">Ana Menü</button></div><div class="grid"><div class="card"><h3>🏆 Pekiştirdiklerim (${reinforced.length})</h3><button class="btn good" onclick="startFrom('reinforced')">Test oluştur</button><div class="list">${reinforced.map(x=>itemHTML(x)).join('')||'<p class=\"sub\">Henüz yok.</p>'}</div></div><div class="card"><h3>Öğrendiklerim (${learned.length})</h3><button class="btn good" onclick="startFrom('learned')">Test oluştur</button><div class="list">${learned.map(x=>itemHTML(x)).join('')||'<p class=\"sub\">Henüz yok.</p>'}</div></div><div class="card"><h3>Öğreneceklerim (${learning.length})</h3><button class="btn" onclick="startFrom('learning')">Test oluştur</button><div class="list">${learning.map(x=>itemHTML(x)).join('')||'<p class=\"sub\">Henüz yok.</p>'}</div></div></div></div>`}function itemHTML(x){let n=Array.isArray(state.correctTests[x.id])?state.correctTests[x.id].length:0;return `<div class="item"><div><b>${esc(x.word)}</b><div class="small">${esc(x.meaning)}</div><div class="small">${esc((x.synonyms||[]).join(', '))}</div></div><span class="badge">${status(x.id)==='reinforced'?'4/4':n+'/4'}</span></div>`}
function showStats(){screen='stats';render()}function statsHTML(){let total=WORDS.length,attempted=Object.keys(state.stats).length,reinf=state.reinforced.length,correct=Object.values(state.stats).reduce((s,x)=>s+x.correct,0),wrong=Object.values(state.stats).reduce((s,x)=>s+x.wrong,0);let weak=WORDS.filter(x=>((state.stats[x.id]&&state.stats[x.id].wrong)||0)>0).sort((a,b)=>(state.stats[b.id]?.wrong||0)-(state.stats[a.id]?.wrong||0)).slice(0,20);return `<div class="wrap"><div class="top"><div><div class="brand">📊 İstatistikler</div><div class="sub">İlerleyişin cihazında saklanır.</div></div><button class="btn secondary" onclick="home()">Ana Menü</button></div><div class="grid"><div class="card"><div class="small">Toplam</div><div class="stat">${total}</div></div><div class="card"><div class="small">Öğrendim</div><div class="stat">${state.learned.length}</div></div><div class="card"><div class="small">Öğreneceğim</div><div class="stat">${state.learning.length}</div></div><div class="card"><div class="small">Cevap başarı</div><div class="stat">${correct+wrong?Math.round(correct/(correct+wrong)*100):0}%</div></div></div><div class="card panel"><h3>En çok zorlandıkların</h3><div class="list">${weak.map(x=>`<div class="item"><div><b>${esc(x.word)}</b><div class="small">${esc(x.meaning)}</div></div><span class="badge">${state.stats[x.id].wrong} yanlış</span></div>`).join('')||'<p class="sub">Henüz yeterli veri yok.</p>'}</div></div></div>`}
try{render()}catch(e){document.getElementById('app').innerHTML='<div style="font-family:Arial;padding:30px;max-width:700px;margin:auto"><h2>YDS Kelime Ustası</h2><p>Uygulama başlatılırken bir hata oluştu.</p><pre style="white-space:pre-wrap;background:#eee;padding:12px;border-radius:8px">'+String(e&&e.stack||e)+'</pre><p>Bu ekran görünüyorsa JavaScript çalışıyor; hata ayrıntısını bana gönderebilirsiniz.</p></div>'}
</script></body></html>
