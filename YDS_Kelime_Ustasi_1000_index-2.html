function homeHTML(){return `<div class="wrap"><div class="top"><div><div class="brand">🧠 YDS / YÖKDİL Kelime Ustası</div><div class="sub">Tek havuz • ${WORDS.length} kelime • kişisel tekrar sistemi</div></div><div class="row"><button class="btn secondary" onclick="showLists()">📚 Kelimeler</button><button class="btn secondary" onclick="showStats()">📊 İstatistik</button></div></div><div class="grid"><div class="card"><h3>Öğrendiklerim</h3><div class="stat">${state.learned.length}</div><div class="sub">2+ doğru ile pekişenler</div><button class="btn good" style="margin-top:12px" onclick="startFrom('learned')">Tekrar Testi</button></div><div class="card"><h3>Öğreneceklerim</h3><div class="stat">${state.learning.length}</div><div class="sub">Yanlış / bilmiyorum havuzu</div><button class="btn" style="margin-top:12px" onclick="startFrom('learning')">Tekrar Testi</button></div><div class="card"><h3>Toplam</h3><div class="stat">${WORDS.length}</div><div class="sub">Yeni kelimeler</div><button class="btn secondary" style="margin-top:12px" onclick="openSetup('all')">Yeni kelimelerden test</button></div></div><div class="card panel"><h3>Yeni Test Oluştur</h3><div class="grid"><div><div class="small">Kelime kaynağı</div><select id="day" class="select"><option value="all">Yeni kelimeler (${WORDS.filter(x=>status(x.id)==='new').length})</option><option value="learning">Öğreneceklerim (${state.learning.length})</option><option value="learned">Öğrendiklerim (${state.learned.length})</option><option value="weak">En zayıf kelimeler</option></select></div><div><div class="small">Soru sayısı</div><input id="count" class="select" type="number" min="1" value="20" placeholder="Örn. 200"></div><div><div class="small">Soru yönü</div><select id="mode" class="select"><option value="en-tr">İngilizce → Türkçe</option><option value="tr-en">Türkçe → İngilizce</option><option value="en-en">İngilizce → İngilizce</option><option value="context">Cümlede boşluk</option></select></div></div><div class=" function openSetup(d){document.getElementById('day').value=d;try{window.scrollTo(0,document.body.scrollHeight)}catch(e){window.scrollTo(0,document.body.scrollHeight)}}
function beginSetup(){let d=document.getElementById('day').value;let n=Math.max(1,parseInt(document.getElementById('count').value||20));let mode=document.getElementById('mode').value;startTest(d,n,mode)}
function startFrom(type){startTest(type,Math.max(1,type==='learning'?state.learning.length:Math.min(20,state.learned.length)), 'en-tr')}
function startTest(source,n,mode){let pool=source==='learned'?WORDS.filter(x=>state.learned.includes(x.id)):source==='learning'?WORDS.filter(x=>state.learning.includes(x.id)):source==='weak'?WORDS.filter(x=>((state.stats[x.id]&&state.stats[x.id].wrong)||0)>0).sort((a,b)=>(state.stats[b.id]?.wrong||0)-(state.stats[a.id]?.wrong||0)):WORDS.filter(x=>status(x.id)==='new');if(!pool.length){alert('Bu listede henüz kelime yok.');return}pool=unique(pool).sort(()=>Math.random()-.5).slice(0,Math.min(n,pool.length));test={pool,index:0,score:0,wrong:0,mode,answered:false,paused:false};screen='test';render()}
function definitionFor(q){
  if(q.definition)return q.definition;
  const syn=(q.synonyms||[]).filter(Boolean).slice(0,3);
  if(!syn.length)return 'an English word with a related meaning';
  const w=q.word.toLowerCase();
  const verbs=new Set(['analyze','approach','indicate','establish','assess','evaluate','determine','identify','investigate','examine','demonstrate','suggest','imply','assume','observe','interpret','reveal','confirm','obtain']);
  return verbs.has(w)?'to '+syn.join(', or '):syn.join(', or ');
}
function choiceObjects(q){
  let pool=WORDS.filter(x=>x.id!==q.id).sort(()=>Math.random()-.5).slice(0,3);
  let arr;
  if(test.mode==='en-tr'){
    arr=[{id:q.id,value:q.meaning},{id:pool[0].id,value:pool[0].meaning},{id:pool[1].id,value:pool[1].meaning},{id:pool[2].id,value:pool[2].meaning}];
  }else if(test.mode==='en-en'){
    arr=[{id:q.id,value:definitionFor(q)},{id:pool[0].id,value:definitionFor(pool[0])},{id:pool[1].id,value:definitionFor(pool[1])},{id:pool[2].id,value:definitionFor(pool[2])}];
  }else{
    arr=[{id:q.id,value:q.word},{id:pool[0].id,value:pool[0].word},{id:pool[1].id,value:pool[1].word},{id:pool[2].id,value:pool[2].word}];

}
function answer(id,choiceId){
  if(test.answered)return;
  let q=WORDS.find(x=>x.id===id),dontKnow=choiceId===null,correct=!dontKnow&&choiceId===q.id;

    test.wrong++;
    let f=document.getElementById('fb');
    let correctText=test.mode==='en-tr'?q.meaning:(test.mode==='en-en'?definitionFor(q):q.word);
    let syn=(q.synonyms||[]).filter(Boolean).join(', ');
    f.innerHTML=`<div class="feedback"><h4>${dontKnow?'🤔 Cevap:':'❌ Doğru cevap:'} <b>${esc(correctText)}</b></h4><div><b>${esc(q.word)}</b> — ${esc(q.meaning)}</div>${!dontKnow?`<div class="small" style="margin-top:7px">Eş anlamlılar: ${esc(syn)}</div>`:''}<div class="ex" style="margin-top:10px">${esc(q.example)}</div><div class="tr">🇹🇷 ${esc(q.translation)}</div><div class="row" style="margin-top:12px"><button class="btn" onclick="nextAfterWrong()">Devam Et</button></div></div>`;

function showStats(){screen='stats';render()}function statsHTML(){let total=WORDS.length,attempted=Object.keys(state.stats).length,correct=Object.values(state.stats).reduce((s,x)=>s+x.correct,0),wrong=Object.values(state.stats).reduce((s,x)=>s+x.wrong,0);let weak=WORDS.filter(x=>((state.stats[x.id]&&state.stats[x.id].wrong)||0)>0).sort((a,b)=>(state.stats[b.id]?.wrong||0)-(state.stats[a.id]?.wrong||0)).slice(0,20);return `<div class="wrap"><div class="top"><div><div class="brand">📊 İstatistikler</div><div class="sub">İlerleyişin cihazında saklanır.</div></div><button class="btn secondary" onclick="home()">Ana Menü</button></div><div class="grid"><div class="card"><div class="small">Toplam</div><div class="stat">${total}</div></div><div class="card"><div class="small">Öğrendim</div><div class="stat">${state.learned.length}</div></div><div class="card"><div class="small">Öğreneceğim</div><div class="stat">${state.learning.length}</div></div><div class="card"><div class="small">Cevap başarı</div><div class="stat">${correct+wrong?Math.round(correct/(correct+wrong)*100):0}%</div></div></div><div class="card panel"><h3>En çok zorlandıkların</h3><div class="list">${weak.map(x=>`<div class="item"><div><b>${esc(x.word)}</b><div class="small">${esc(x.meaning)}</div></div><span class="badge">${state.stats[x.id].wrong} yanlış</span></div>`).join('')||'<p class="sub">Henüz yeterli veri yok.</p>'}</div></div></div>`}
